<!doctype html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sveriges Landskap Quiz</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f1923;color:#e8edf2;font-family:'Segoe UI',system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{background:#16213e;border-bottom:1px solid #1a3a5c;padding:8px 16px;flex-shrink:0}
.hdr{display:flex;align-items:center;justify-content:space-between;max-width:960px;margin:0 auto;width:100%}
.progress{font-size:13px;color:#7f9ab5;min-width:60px}
.pname{font-size:clamp(16px,3.5vw,26px);font-weight:700;color:#fff;letter-spacing:.5px;min-height:34px;text-align:center;transition:color .2s}
.pname.correct{color:#4CAF50}.pname.wrong{color:#f44336}
.hdr-right{display:flex;align-items:center;gap:10px;min-width:120px;justify-content:flex-end}
.timer{font-size:13px;color:#7f9ab5}
.btn-restart{padding:4px 12px;border:1px solid #2a4a6a;border-radius:12px;cursor:pointer;font-size:12px;font-weight:600;background:transparent;color:#7f9ab5;transition:all .15s}
.btn-restart:hover{background:#1a3a5c;color:#e8edf2}
main{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;padding:6px 12px;overflow:hidden}
.controls{display:flex;gap:8px;margin-bottom:6px;flex-shrink:0}
.btn{padding:4px 14px;border:none;border-radius:20px;cursor:pointer;font-size:12px;font-weight:600;transition:all .15s}
.btn-quiz{background:#1a4a7a;color:#e8edf2}.btn-quiz.active{background:#2196F3;color:#fff}
.btn-study{background:#1a4a2a;color:#e8edf2}.btn-study.active{background:#4CAF50;color:#fff}
.btn-start{background:#2196F3;color:#fff;padding:10px 32px;font-size:16px;border-radius:24px;border:none;cursor:pointer;font-weight:700;margin-top:12px;display:block;width:100%}
.game-row{flex:1;display:flex;width:100%;max-width:960px;gap:12px;min-height:0}
.sidebar{width:64px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding-top:10px;gap:6px}
.wrong-label{font-size:10px;color:#7f9ab5;text-transform:uppercase;letter-spacing:.5px;text-align:center}
.att-info{font-size:9px;color:#4a6a8a;text-align:center;margin-top:2px}
.dots{display:flex;flex-direction:column;gap:5px;align-items:center}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid #2a3a4a;background:#1e2d3d;transition:background .3s,border-color .3s,opacity .3s}
.dot.inactive{opacity:.25}
.map-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
svg{width:auto;height:100%;max-height:calc(100dvh - 150px)}
.overlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(22,33,62,.97);border:1px solid #1a3a5c;border-radius:16px;padding:24px 32px;text-align:center;z-index:100;min-width:260px}
.overlay h2{font-size:22px;margin-bottom:6px}
.overlay p{color:#7f9ab5;margin-bottom:4px}
.res-row{display:flex;justify-content:space-between;gap:36px;margin-bottom:8px;font-size:14px}
.res-row strong{color:#2196F3}
.legend{margin:10px 0 8px;display:flex;flex-direction:column;gap:4px;text-align:left;font-size:11px}
.leg-row{display:flex;align-items:center;gap:8px}
.leg-sq{width:14px;height:14px;border-radius:3px;flex-shrink:0}
</style>
</head>
<body>
<header>
  <div class="hdr">
    <span class="progress" id="prog"></span>
    <div class="pname" id="pname">Sveriges Landskap</div>
    <div class="hdr-right">
      <span class="timer" id="timer"></span>
      <button class="btn-restart" id="btnRestart" style="display:none">Starta om</button>
    </div>
  </div>
</header>
<main>
  <div class="controls">
    <button class="btn btn-quiz active" id="btnQuiz">Quiz</button>
    <button class="btn btn-study" id="btnStudy">Studera</button>
  </div>
  <div class="game-row">
    <div class="sidebar">
      <div class="wrong-label" id="wrongLabel" style="visibility:hidden">Fel</div>
      <div class="dots">
        <div class="dot" id="d1"></div>
        <div class="dot" id="d2"></div>
        <div class="dot" id="d3"></div>
        <div class="dot" id="d4"></div>
      </div>
      <div class="att-info" id="attInfo"></div>
    </div>
    <div class="map-wrap">
      <svg id="map" viewBox="0 0 500 950" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>
  <div class="overlay" id="overlay">
    <h2>Sveriges Landskap</h2>
    <p>Klicka på rätt landskap på kartan</p>
    <div class="legend">
      <div class="leg-row"><div class="leg-sq" style="background:#fff;border:1px solid #ccc"></div><span>Rätt på 1:a försöket</span></div>
      <div class="leg-row"><div class="leg-sq" style="background:#FFC107"></div><span>Rätt på 2:a försöket</span></div>
      <div class="leg-row"><div class="leg-sq" style="background:#FF9800"></div><span>Rätt på 3:e försöket</span></div>
      <div class="leg-row"><div class="leg-sq" style="background:#F44336"></div><span>Rätt på 4:e försöket</span></div>
    </div>
    <button class="btn-start" id="btnStart">Starta quiz</button>
  </div>
</main>

var mode='quiz', phase='start', queue=[], idx=0;

function getMaxAttempts() {
  var remaining = queue.length - idx; // remaining including current
  return Math.max(1, Math.min(4, remaining - 1));
}

function shuffle(a) {
  var b=a.slice();
  for (var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}
  return b;
}

function fmt(s) {
  return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}

function updateDots() {
  var maxAtt = getMaxAttempts();
  for (var i=1;i<=4;i++) {
    var d=document.getElementById('d'+i);
    var active = i <= curAttempts;
    var available = i <= maxAtt;
    d.style.background = active ? DOT_BG[i-1] : '#1e2d3d';
    d.style.borderColor = active ? DOT_BD[i-1] : '#2a3a4a';
    d.className = 'dot' + (available ? '' : ' inactive');
  }
  var attEl = document.getElementById('attInfo');
  var maxAtt2 = getMaxAttempts();
  attEl.textContent = phase==='playing' ? (maxAtt2 < 4 ? maxAtt2+' max' : '') : '';
}

function resetDots() {
  curAttempts=0; curWrongIds=[];
  for (var i=1;i<=4;i++){
    var d=document.getElementById('d'+i);
    d.style.background='#1e2d3d';
    d.style.borderColor='#2a3a4a';
    d.className='dot';
  }
  document.getElementById('attInfo').textContent='';
}

}

function flashName(cls) {
  var el=document.getElementById('pname');
  el.classList.add(cls);
  setTimeout(function(){el.classList.remove(cls);},600);
}

function getCenter(path) {
  var re=/-?[\d.]+,-?[\d.]+/g,m;
  var x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  while((m=re.exec(path))!==null){
    var pts=m[0].split(',');
    var x=parseFloat(pts[0]),y=parseFloat(pts[1]);
    if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
  }
  return [(x0+x1)/2,(y0+y1)/2];
}

    if(showLabel) {
      var c=getCenter(p.path);
      var fs=p.name.length>10?7:p.name.length>7?8:9;
      // Text color: dark on light fills (white, yellow), light on dark fills
      var tc='#1a1a2e';
      if(col==='#F44336'||col==='#B71C1C'||col==='#7B0000'||col==='#FF9800') tc='#fff';
      if(col==='#FFFFFF') tc='#1a1a2e';
      html+='<text x="'+c[0]+'" y="'+c[1]+
            '" text-anchor="middle" dominant-baseline="middle" font-size="'+fs+
            '" fill="'+tc+'" font-weight="600" font-family="system-ui,sans-serif"'+
            ' style="pointer-events:none">'+p.name+'</text>';
    }
  }
  svg.innerHTML=html;
  // Wire events
  var paths=svg.querySelectorAll('path');
  for(var j=0;j<paths.length;j++) {
    (function(path){
      path.addEventListener('mouseenter',function(){
        if(!processed[this.dataset.id]&&this.getAttribute('fill')==='#c8d8e8')
          this.setAttribute('fill','#a0bcd4');
      });
      path.addEventListener('mouseleave',function(){
        this.setAttribute('fill',fills[this.dataset.id]||'#c8d8e8');
      });
      path.addEventListener('click',function(){onPathClick(this.dataset.id);});
    })(paths[j]);
  }
}

function onPathClick(id) {
  if(locked||phase!=='playing'||mode!=='quiz') return;
  var cur=queue[idx];
  if(!cur) return;
  if(processed[id]) return; // block already-done or already-revealed provinces

  if(id===cur.id) {
    // CORRECT
    locked=true; correct++;
    var col=CORRECT_COLORS[Math.min(curAttempts,3)];
    fills[cur.id]=col;
    done[cur.id]=true;
    processed[cur.id]=true;
    // Clear this round's wrong fills
    for(var i=0;i<curWrongIds.length;i++) delete fills[curWrongIds[i]];
    flashName('correct');
    renderMap();
    setTimeout(function(){locked=false;advance();},300);
  } else {
    // Already tried this wrong province this round?
    for(var k=0;k<curWrongIds.length;k++) if(curWrongIds[k]===id) return;
    mistakes++;
    fills[id]=TRY_COLORS[curAttempts]||TRY_COLORS[3];
    curWrongIds.push(id);
    curAttempts++;
    updateDots();
    flashName('wrong');
    renderMap();

    if(curAttempts>=getMaxAttempts()) {
      locked=true;
      setTimeout(function(){
        fills[cur.id]='#B71C1C';
        processed[cur.id]=true; // block re-clicking during retry round
        renderMap();
        setTimeout(function(){
          for(var i=0;i<curWrongIds.length;i++) delete fills[curWrongIds[i]];
          locked=false;
          advance();
        },600);
      },150);
    }
  }
}

function advance() {
  var nextIdx=idx+1;
  if(nextIdx>=queue.length) {
    // Find missed (revealed but not done)
    var missed=[];
    for(var i=0;i<PROVINCES.length;i++){
      if(!done[PROVINCES[i].id]) {
        // Was it in the queue? Check fills for #B71C1C or just not done
        missed.push(PROVINCES[i]);
      }
    }
    // Only retry those that were actually in this queue (not just any undone)
    // Better: track missed explicitly
    var missedFromQueue=[];
    for(var i=0;i<queue.length;i++){
      if(!done[queue[i].id]) missedFromQueue.push(queue[i]);
    }
    if(missedFromQueue.length>0) {
      queue=shuffle(missedFromQueue); idx=0;
      resetDots(); updateHUD(); renderMap(); return;
    }
    // All done
    clearInterval(timerInt); phase='results';
    var score=mistakes===0&&correct===25?100:Math.round(correct/(correct+mistakes)*100);
    document.getElementById('wrongLabel').style.visibility='hidden';
    document.getElementById('btnRestart').style.display='none';
    var ov=document.getElementById('overlay');
    ov.innerHTML=
      '<h2>Klart!</h2>'+
      '<div class="res-row"><span>Tid</span><strong>'+fmt(elapsed)+'</strong></div>'+
      '<div class="res-row"><span>Fel</span><strong>'+mistakes+'</strong></div>'+
      '<div class="res-row"><span>Poäng</span><strong>'+score+'%</strong></div>'+
      '<div class="legend">'+
      '<div class="leg-row"><div class="leg-sq" style="background:#fff;border:1px solid #ccc"></div><span>1:a försöket</span></div>'+
      '<div class="leg-row"><div class="leg-sq" style="background:#FFC107"></div><span>2:a försöket</span></div>'+
      '<div class="leg-row"><div class="leg-sq" style="background:#FF9800"></div><span>3:e försöket</span></div>'+
      '<div class="leg-row"><div class="leg-sq" style="background:#F44336"></div><span>4:e försöket</span></div>'+
      '</div>'+
      '<button class="btn-start" id="btnReplay">Spela igen</button>';
    ov.style.display='block';
    document.getElementById('btnReplay').addEventListener('click',startQuiz);
    renderMap(); return;
  }
  idx=nextIdx;
  resetDots(); updateHUD();
  // Update dot visibility for new remaining count
  updateDots();
  renderMap();
}

function startQuiz() {
  queue=shuffle(PROVINCES); idx=0; fills={}; done={}; processed={};
  mistakes=0; correct=0; elapsed=0; locked=false; phase='playing';
  document.getElementById('overlay').style.display='none';
  document.getElementById('wrongLabel').style.visibility='visible';
  document.getElementById('btnRestart').style.display='block';
  startT=Date.now();
  clearInterval(timerInt);
  timerInt=setInterval(function(){
    elapsed=Math.floor((Date.now()-startT)/1000);
    document.getElementById('timer').textContent=fmt(elapsed);
  },500);
  resetDots(); updateHUD(); updateDots(); renderMap();
}

function setMode(m) {
  mode=m;
  document.getElementById('btnQuiz').classList.toggle('active',m==='quiz');
  document.getElementById('btnStudy').classList.toggle('active',m==='study');
  if(m==='study'){
    if(phase==='playing'){clearInterval(timerInt);phase='start';}
    document.getElementById('overlay').style.display='none';
    document.getElementById('wrongLabel').style.visibility='hidden';
    document.getElementById('btnRestart').style.display='none';
    resetDots();
  } else {
    if(phase==='start') document.getElementById('overlay').style.display='block';
  }
  renderMap();
}

document.getElementById('btnStart').addEventListener('click',startQuiz);
document.getElementById('btnRestart').addEventListener('click',startQuiz);
document.getElementById('btnQuiz').addEventListener('click',function(){setMode('quiz');});
document.getElementById('btnStudy').addEventListener('click',function(){setMode('study');});

renderMap();
</script>
</body>
</html>
